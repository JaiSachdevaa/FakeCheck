services:
  - type: web
    name: fakecheck-api
    runtime: python
    buildCommand: pip install -r fake-news-backend/requirements.txt && cd fake-news-backend && python augment.py && python train.py
    startCommand: cd fake-news-backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app